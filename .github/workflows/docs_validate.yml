name: 📃 Docfx Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    name: 📚 Doc validation
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
    - name: 🔗 Markup Link Checker (mlc)
      uses: becheran/mlc@c925f90a9a25e16e4c4bfa29058f6f9ffa9f0d8c # v0.21.0
      with:
        args: --do-not-warn-for-redirect-to https://learn.microsoft.com*,https://dotnet.microsoft.com/*,https://dev.azure.com/*,https://app.codecov.io/* -p docfx -i https://aka.ms/onboardsupport,https://aka.ms/spot,https://msrc.microsoft.com/*,https://www.microsoft.com/msrc*,https://microsoft.com/msrc*
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites
        dotnet --info
      shell: pwsh
    - name: 🛠 build
      run: dotnet build -c Release -p:SkipVsixBuild=true -bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"
    - name: 📚 Verify docfx build
      run: dotnet docfx docfx/docfx.json --warningsAsErrors --disableGitFeatures
      if: runner.os == 'Linux'
